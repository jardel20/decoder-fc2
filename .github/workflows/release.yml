name: FC2 Explorer release
on:
  workflow_dispatch:
  push:
    branches: ["feature/**"]
    tags: ["v*"]
    paths: [".github/workflows/release.yml", "desktop/src-tauri/tauri.conf.json"]
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libwayland-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 build-essential pkg-config file
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop
      - name: Core and bridge tests
        run: cargo test --locked && cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --no-default-features
      - name: Build AppImage
        run: npx tauri build --bundles appimage
        working-directory: desktop
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Name and checksum
        run: |
          mkdir dist
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/FC2-Explorer-x86_64.AppImage
          cd dist && sha256sum FC2-Explorer-x86_64.AppImage > FC2-Explorer-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FC2-Explorer-Linux-AppImage
          path: dist/*
          if-no-files-found: error
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Rust stable
        run: rustup update stable; rustup default stable
      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop
      - name: Core and bridge tests
        run: cargo test --locked; cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --no-default-features
      - name: Build portable executable
        run: npx tauri build --no-bundle
        working-directory: desktop
      - name: Name and checksum
        shell: bash
        run: |
          mkdir dist
          cp desktop/src-tauri/target/release/fc2-desktop.exe dist/FC2-Explorer-Windows-portable.exe
          cd dist && sha256sum FC2-Explorer-Windows-portable.exe > FC2-Explorer-Windows-portable.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FC2-Explorer-Windows-portable
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "FC2 Explorer ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
