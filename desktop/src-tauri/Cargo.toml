[package]
name = "fc2-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "FC2 Explorer desktop, powered by Tauri"

[lib]
name = "fc2_desktop"

[[bin]]
name = "fc2-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
fc2-rs = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
rfd = { version = "=0.17.2", optional = true }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
